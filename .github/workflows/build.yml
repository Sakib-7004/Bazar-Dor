name: Build check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check TypeScript
        run: npm run lint
      - name: Build Next.js app
        run: npm run build
        env:
          BETTER_AUTH_SECRET: ci-only-secret-that-is-long-enough-for-build-check
          BETTER_AUTH_URL: http://localhost:3000
